name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code accepts the marketplace and every plugin
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: The skills CLI finds relay's skills
        run: npx -y skills add . --list | tee skills.txt && grep -q build-issue skills.txt && grep -q file-issue skills.txt
      - name: Every changed plugin has a new version
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "$GITHUB_BASE_REF"
          status=0
          for p in plugins/*/; do
            p=${p%/}
            git diff --quiet "origin/$GITHUB_BASE_REF" -- "$p" && continue
            old=$(git show "origin/$GITHUB_BASE_REF:$p/.claude-plugin/plugin.json" 2>/dev/null | jq -r .version)
            new=$(jq -r .version "$p/.claude-plugin/plugin.json")
            if [ -n "$old" ] && [ "$old" = "$new" ]; then
              echo "::error file=$p/.claude-plugin/plugin.json::$p changed but its version is still $new"
              status=1
            fi
          done
          exit $status
